name: Escaner de senales

on:
  schedule:
    - cron: "2,32 * * * *"    # cada 30 minutos (minutos 2 y 32, hora UTC): justo después de cerrar cada vela de 30 min
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: escaner
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar librerias
        run: pip install pandas numpy requests
      - name: Escanear
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python escaner.py
      - name: Informe
        run: python analizar.py > /dev/null
      - name: Guardar datos
        run: |
          git config user.name "escaner"
          git config user.email "escaner@users.noreply.github.com"
          git add datos
          if ! git diff --staged --quiet; then
            git commit -m "datos $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
