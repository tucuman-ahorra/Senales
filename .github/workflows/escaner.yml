name: Escaner de senales

on:
  schedule:
    - cron: "7 * * * *"       # cada hora: si ya hay una corrida en curso, esta queda esperando y arranca apenas termine la otra
  workflow_dispatch:          # permite arrancarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: escaner
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # cada corrida trabaja casi 6 horas seguidas (el máximo de GitHub)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar librerias
        run: pip install pandas numpy requests
      - name: Configurar git
        run: |
          git config user.name "escaner"
          git config user.email "escaner@users.noreply.github.com"
      - name: Escanear (queda trabajando y corre justo al cerrar cada vela de 30 min)
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python escaner.py --bucle
      - name: Guardar datos pendientes
        if: always()
        run: |
          git add datos
          if ! git diff --staged --quiet; then
            git commit -m "datos $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
